[project]
name = "agentic-context-service-ci"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["dagger-io"]

[project.entry-points."dagger.mod"]
main_object = "agentic_context_service_ci:AgenticContextService"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagger-io = { path = "sdk", editable = true }

[tool.dagger]
base-image = "python:3.13.14-bookworm@sha256:8b9a8b28d9cc221c6ab5d40e9cfcd99429959f6a8f5171612a99147975ab043f"
